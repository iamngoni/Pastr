name: PastrMobile
options:
  bundleIdPrefix: za.co.codecraftsolutions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "4973Y692JU"

targets:
  PastrMobile:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: CloudSync
      - path: PastrMobile
      - path: ../Pastr/Pastr.xcdatamodeld
    info:
      path: PastrMobile/Info.plist
      properties:
        CFBundleDisplayName: Pastr
        CFBundleIdentifier: za.co.codecraftsolutions.Pastr
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: PastrMobile/PastrMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - group.za.co.codecraftsolutions.Pastr
        com.apple.developer.icloud-container-identifiers:
          - iCloud.za.co.codecraftsolutions.Pastr
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: za.co.codecraftsolutions.Pastr
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PastrKeyboard
        embed: true
      - target: PastrShareExtension
        embed: true

  PastrKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: PastrKeyboard
    info:
      path: PastrKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Pastr Keyboard
        CFBundleIdentifier: za.co.codecraftsolutions.Pastr.Keyboard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            PrimaryLanguage: en
            RequestsOpenAccess: true
    entitlements:
      path: PastrKeyboard/PastrKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.za.co.codecraftsolutions.Pastr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: za.co.codecraftsolutions.Pastr.Keyboard
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  PastrShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: CloudSync
      - path: PastrShareExtension
      - path: ../Pastr/Pastr.xcdatamodeld
    info:
      path: PastrShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Pastr
        CFBundleIdentifier: za.co.codecraftsolutions.Pastr.ShareExtension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: PastrShareExtension/PastrShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.za.co.codecraftsolutions.Pastr
        com.apple.developer.icloud-container-identifiers:
          - iCloud.za.co.codecraftsolutions.Pastr
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: za.co.codecraftsolutions.Pastr.ShareExtension
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
